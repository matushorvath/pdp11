# Boot from disk, configure the system

set cpu 11/93
set cpu 4m
set cpu idle

set tq enabled

set rq enabled
set rq0 ra81
attach -e rq0 rq0.dsk

set xq enabled
attach xq0 nat:gateway=10.0.0.1/24,dns=10.0.0.2

# handle BSD errors by exiting with non-zero code
expect "EXEC_BSD_FAILED" exit 1

# login as root
expect "login:" send "root\r"; continue

# set TERM to vt100 in /.profile
expect '\n#' do exec-bsd "sed '/export TERM/ i\\\rTERM=vt100' /.profile > /.profile.new"; continue
expect '\n#' do exec-bsd "mv /.profile.new /.profile"; continue

# set TZ to UTC in /etc/rc
expect '\n#' do exec-bsd "sed '/export PATH/ a\\\rTZ=GMT; export TZ' /etc/rc > /etc/rc.new"; continue
expect '\n#' do exec-bsd "mv /etc/rc.new /etc/rc"; continue

# set TZ to UTC in /.profile
expect '\n#' do exec-bsd "echo 'TZ=GMT\rexport TZ' >> /.profile"; continue

# generate /etc/hosts
expect '\n#' do exec-bsd "echo '127.0.0.1 localhost.local localhost.arpa localhost' > /etc/hosts"; continue
expect '\n#' do exec-bsd "echo '10.0.0.10 pdp11.local pdp11' >> /etc/hosts"; continue
expect '\n#' do exec-bsd "mkhosts /etc/hosts"; continue

# generate resolv.conf
expect '\n#' do exec-bsd "echo 'domain local\rnameserver 10.0.0.2' > /etc/resolv.conf"; continue

# update /etc/netstart
expect '\n#' do exec-bsd "sed 's/hostname=localhost\\.2bsd\\.com/hostname=pdp11.local/' /etc/netstart > /etc/netstart.new"; continue
expect '\n#' do exec-bsd "mv /etc/netstart.new /etc/netstart"; continue
expect '\n#' do exec-bsd "sed 's/default=127\\.0\\.0\\.1/default=10.0.0.1/' /etc/netstart > /etc/netstart.new"; continue
expect '\n#' do exec-bsd "mv /etc/netstart.new /etc/netstart"; continue
expect '\n#' do exec-bsd "sed 's/# ifconfig qe0/ifconfig qe0/' /etc/netstart > /etc/netstart.new"; continue
expect '\n#' do exec-bsd "mv /etc/netstart.new /etc/netstart"; continue

# TODO set root password
# passwd root

# shut down
expect '\n#' do exec-bsd "sync"; continue
expect '\n#' send after=100m,"shutdown -h now\r"; continue

boot rq0

exit
