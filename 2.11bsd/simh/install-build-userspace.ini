# Boot from disk, rebuild the userspace

set cpu 11/93
set cpu 4m
set cpu idle

set tq enabled

set rq enabled
set rq0 ra81
attach -e rq0 rq0.dsk

set xq enabled
attach xq0 nat:gateway=10.0.0.1/24,dns=10.0.0.2

# handle BSD errors by exiting with non-zero code
expect "EXEC_BSD_FAILED" exit 1

# login as root
expect "login:" send "root\r"; continue

# rebuild userspace
expect '\n# ' do exec-bsd "cd /usr/src"; continue
expect '\n# ' do exec-bsd "make clean"; continue

expect '\n# ' do exec-bsd "make build"; continue
expect '\n# ' do exec-bsd "make installsrc"; continue
expect '\n# ' do exec-bsd "make clean"; continue

# remove backup copies
expect '\n# ' do exec-bsd "rm -f /etc/init.old"; continue
expect '\n# ' do exec-bsd "rm -f /bin/tcsh.old"; continue
expect '\n# ' do exec-bsd "rm -f /lib/oc?"; continue

# rebuild autoconfig
expect '\n# ' do exec-bsd "cd /usr/src/sys/autoconfig"; continue
expect '\n# ' do exec-bsd "make"; continue
expect '\n# ' do exec-bsd "make install"; continue
expect '\n# ' do exec-bsd "make clean"; continue

# shut down
expect '\n# ' do exec-bsd "sync"; continue
expect '\n# ' send after=100m,"shutdown -h now\r"; continue

boot rq0

exit
