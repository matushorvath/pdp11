# Boot from disk, patch and rebuild the system

set cpu 11/93
set cpu 4m
set cpu idle

set tq enabled
attach -e tq0 -F TAR data.tar

set rq enabled
set rq0 ra81
attach -e rq0 rq0.dsk

# handle BSD errors by exiting with non-zero code
expect "EXEC_BSD_FAILED" exit 1

# login as root
expect "login:" send "root\r"; continue

# set hostname and timezone, they are included in the kernel
expect '\n# ' do exec-bsd "hostname pdp11.local"; continue
expect '\n# ' do exec-bsd "TZ=GMT; export TZ"; continue

# read files from the data tape
expect '\n# ' do exec-bsd "cd /tmp"; continue
expect '\n# ' do exec-bsd "mt rewind ; echo"; continue
expect '\n# ' do exec-bsd "tar xvf /dev/rmt12"; continue

# configure a custom kernel
expect '\n# ' do exec-bsd "cd /usr/src/sys/conf"; continue
expect '\n# ' do exec-bsd "cp /tmp/data/SIMH ."; continue
expect '\n# ' do exec-bsd "./config SIMH"; continue
expect '\n# ' do exec-bsd "cd /sys/SIMH"; continue
expect '\n# ' do exec-bsd "patch Makefile /tmp/data/Makefile.patch"; continue

# rebuild the kernel
expect '\n# ' do exec-bsd "cd /sys/SIMH"; continue
expect '\n# ' do exec-bsd "make"; continue
expect '\n# ' do exec-bsd "make install"; continue

# shut down
expect '\n# ' do exec-bsd "sync"; continue
expect '\n# ' send after=100m,"shutdown -h now\r"; continue

boot rq0

exit
