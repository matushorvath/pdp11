# Boot from disk, install and configure httpd

set cpu 11/93
set cpu 4m
set cpu idle

set tq enabled
attach -e tq0 -F TAR data.tar

set rq enabled
set rq0 ra81
attach -e rq0 rq0.dsk

set xq enabled
attach xq0 nat:gateway=10.0.0.1/24,dns=10.0.0.2

# handle BSD errors by exiting with non-zero code
expect "EXEC_BSD_FAILED" exit 1

# login as root
expect "login:" send "root\r"; continue

# read files from the data tape
expect '\n#' do exec-bsd "cd /tmp"; continue
expect '\n#' do exec-bsd "mt rewind"; continue
expect '\n#' do exec-bsd "tar xvf /dev/rmt12"; continue

# build and install httpd
expect '\n#' do exec-bsd "cp -R /tmp/data/httpd /usr/src/local/"; continue
expect '\n#' do exec-bsd "cd /usr/src/local/httpd"; continue
expect '\n#' do exec-bsd "make"; continue
expect '\n#' do exec-bsd "mv httpd /usr/libexec/httpd"; continue

# create the httpd user and group
expect '\n#' do exec-bsd "echo 'httpd:*:33:34::0:0:httpd daemon:/var/www:/bin/sh' >> /etc/master.passwd"; continue
expect '\n#' do exec-bsd "echo 'httpd:*:33:34:httpd daemon:/var/www:/bin/sh' >> /etc/passwd"; continue
expect '\n#' do exec-bsd "echo 'httpd:*:34:' >> /etc/group"; continue
expect '\n#' do exec-bsd "mkpasswd /etc/master.passwd"; continue
expect '\n#' do exec-bsd "mv /etc/master.passwd.dir /etc/passwd.dir"; continue
expect '\n#' do exec-bsd "mv /etc/master.passwd.pag /etc/passwd.pag"; continue

# configure inetd
expect '\n#' do exec-bsd "echo 'http		80/tcp' >> /etc/services"; continue
expect '\n#' do exec-bsd "echo 'http	stream	tcp	nowait	httpd	/usr/libexec/httpd	httpd' >> /etc/inetd.conf"; continue

# move the basic index.html to /var/www
expect '\n#' do exec-bsd "mkdir -p /var/www"; continue
expect '\n#' do exec-bsd "mv /tmp/data/index.html /var/www/index.html"; continue
expect '\n#' do exec-bsd "chmod 440 /var/www/index.html"; continue
expect '\n#' do exec-bsd "chown -R httpd.httpd /var/www"; continue

# shut down
expect '\n#' do exec-bsd "sync"; continue
expect '\n#' send after=100m,"shutdown -h now\r"; continue

boot rq0

exit
