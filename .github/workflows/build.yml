name: Build

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      no_cache:
        type: boolean
        default: false

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lint sources
        run: make lint

      - name: Build PDP11
        uses: docker/build-push-action@v7
        with:
          target: pdp11
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Unix v6
        uses: docker/build-push-action@v7
        with:
          target: pdp11-unix-v6
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build 2.11BSD
        uses: docker/build-push-action@v7
        with:
          target: pdp11-2.11bsd
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build 2.11BSD with httpd
        uses: docker/build-push-action@v7
        with:
          target: pdp11-2.11bsd-httpd
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
